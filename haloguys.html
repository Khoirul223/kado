<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo dari Kai!</title>
    <style>
        /* Pengaturan tema warna dan latar belakang (Biru sesuai 'sund_blue') */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #7dd3fc);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        /* Desain kartu utama */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 380px;
            text-align: center;
            transition: all 0.5s ease;
        }

        /* Menyembunyikan elemen sebelum waktunya muncul */
        .hidden { display: none !important; }
        
        /* Animasi memudar */
        .fade-in { animation: fadeIn 1s forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gaya Tombol Sapaan */
        .btn-start {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: transform 0.2s, background 0.3s;
            margin-top: 15px;
        }
        .btn-start:hover {
            background: #0284c7;
            transform: scale(1.05);
        }

        /* Tipografi Profil */
        h1 { color: #0369a1; margin-bottom: 5px; }
        .ig-handle { color: #64748b; font-size: 15px; margin-bottom: 20px; font-weight: 500; }
        .intro-text { font-size: 15px; line-height: 1.6; min-height: 80px; color: #475569; }

        /* Desain Tombol Hobi */
        .hobbies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .hobby-tag {
            background: #f0f9ff;
            color: #0284c7;
            border: 2px solid #bae6fd;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .hobby-tag:hover {
            background: #e0f2fe;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Emoji Profil */
        .profile-emoji { font-size: 60px; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- Bagian 1: Layar Sapaan Awal -->
    <div id="intro-screen" class="card">
        <div class="profile-emoji">👋</div>
        <h1>Halo!</h1>
        <p>Ada pesan perkenalan singkat nih buat kamu.</p>
        <button class="btn-start" onclick="bukaProfil()">Ketuk di sini!</button>
    </div>

    <!-- Bagian 2: Layar Profil Kai -->
    <div id="profile-screen" class="card hidden">
        <h1>Hai, aku Kai! ✨</h1>
        <div class="ig-handle">@sund_blue</div>
        
        <!-- Tempat teks mengetik otomatis -->
        <p class="intro-text" id="typewriter-text"></p>
        
        <!-- Daftar Hobi -->
        <div class="hobbies hidden fade-in" id="hobbies-container">
            <span class="hobby-tag" onclick="alert('⚽ Yuk kapan-kapan main futsal bareng!')">Futsal</span>
            <span class="hobby-tag" onclick="alert('🏸 Smash! Suka main badminton juga?')">Badminton</span>
            <span class="hobby-tag" onclick="alert('🏊 Nyebur ke air bikin pikiran jadi fresh lho!')">Berenang</span>
            <span class="hobby-tag" onclick="alert('🏃 Lari santai biar badan tetap fit!')">Jogging</span>
        </div>
    </div>

    <script>
        // Fungsi untuk mengganti layar dari Sapaan ke Profil
        function bukaProfil() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('profile-screen').classList.remove('hidden');
            document.getElementById('profile-screen').classList.add('fade-in');
            
            // Memulai efek mengetik
            mulaiNgetik();
        }

        // Fungsi Efek Mengetik (Typewriter)
        const teksPerkenalan = "Salam kenal! Selamat datang di duniaku. Selain aktif scroll sosmed, aku juga suka banget ngabisin waktu buat olahraga. Coba klik hobi aku di bawah ini ya!";
        let i = 0;
        const kecepatanKetik = 40; // Kecepatan mengetik dalam milidetik

        function mulaiNgetik() {
            if (i < teksPerkenalan.length) {
                document.getElementById("typewriter-text").innerHTML += teksPerkenalan.charAt(i);
                i++;
                setTimeout(mulaiNgetik, kecepatanKetik);
            } else {
                // Munculkan tombol hobi setelah teks selesai diketik
                document.getElementById('hobbies-container').classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
