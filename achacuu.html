<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Love - achacuu:></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030005; /* Warna latar belakang gelap gulita */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Kanvas Three.js di belakang */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Supaya tidak mengganggu klik */
        }

        /* Container untuk teks yang mengorbit (HTML overlay) */
        #orbit-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Gaya teks yang berputar */
        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            color: #ff4d6d;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        /* Ikon/Emoji pengganti gambar Spiderman & Hello Kitty */
        .orbit-icon {
            font-size: 35px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
        }

        /* Teks utama di paling bawah */
        #main-text {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb3c6;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 45px #ff0055;
            z-index: 3;
            animation: pulse 2s infinite ease-in-out;
            font-style: italic;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(0.95); opacity: 0.8; }
            50% { transform: translateX(-50%) scale(1.05); opacity: 1; }
            100% { transform: translateX(-50%) scale(0.95); opacity: 0.8; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="orbit-container">
        </div>

    <div id="main-text">achacuu:></div>

    <script>
        // ==========================================
        // 1. PENGATURAN ORBIT TEKS (HTML)
        // ==========================================
        const orbitData = [
            "TAK TERHINGGA ∞",
            "<span class='orbit-icon'>🕷️❤️</span>", // Ikon Spider-Man
            "CINTA ABADI",
            "HIDUPKU",
            "<span class='orbit-icon'>🐱🎀</span>", // Ikon Hello Kitty
            "SELAMANYA",
            "TAK TERHINGGA ∞",
            "MILIKKU"
        ];

        const orbitContainer = document.getElementById('orbit-container');
        const elements = [];

        // Buat elemen HTML untuk setiap teks
        orbitData.forEach(item => {
            const el = document.createElement('div');
            el.className = 'orbit-item';
            el.innerHTML = item;
            orbitContainer.appendChild(el);
            elements.push(el);
        });

        let orbitTime = 0;
        function animateOrbit() {
            orbitTime += 0.004; // Kecepatan putaran teks
            
            elements.forEach((el, index) => {
                const angle = orbitTime + (index / elements.length) * Math.PI * 2;
                
                // Menghitung ukuran elips orbit berdasarkan ukuran layar
                const radiusX = window.innerWidth * 0.35; 
                const radiusY = window.innerHeight * 0.15; // Dibuat pipih agar terlihat 3D
                
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;
                
                // Kalkulasi kedalaman (z) untuk efek ilusi 3D (membesar di depan, mengecil di belakang)
                const depth = Math.sin(angle); 
                const scale = (depth + 2) / 2.2; // Rentang skala
                const opacity = (depth + 1.5) / 2.5; // Meredup saat di belakang hati
                
                el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
                el.style.opacity = opacity;
                el.style.zIndex = Math.round(depth * 100);
            });
            requestAnimationFrame(animateOrbit);
        }
        animateOrbit();


        // ==========================================
        // 2. PENGATURAN 3D GALAXY HATI (THREE.JS)
        // ==========================================
        let scene, camera, renderer, heartMesh, spiralMesh;

        function init3D() {
            scene = new THREE.Scene();

            // Atur sudut kamera (agak menunduk agar pas dengan orbit teks)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 55);
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // A. MEMBUAT BENTUK HATI (BERDIRI)
            const heartGeo = new THREE.BufferGeometry();
            const heartCount = 3500;
            const hPos = new Float32Array(heartCount * 3);
            const hCol = new Float32Array(heartCount * 3);

            for(let i=0; i<heartCount; i++) {
                const t = Math.random() * Math.PI * 2;
                
                // Rumus Matematika Hati (Sekarang X dan Y benar, sehingga hati berdiri)
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = 0;
                
                // Diperkecil sedikit
                x *= 0.9; y *= 0.9; z *= 0.9;
                
                // Efek partikel menyebar di sekitar garis hati
                const scatter = Math.random() * 1.5;
                const ang = Math.random() * Math.PI * 2;
                x += Math.cos(ang) * scatter;
                y += Math.sin(ang) * scatter;
                z += (Math.random() - 0.5) * 2;

                hPos[i*3] = x;
                hPos[i*3+1] = y + 5; // Digeser ke atas agar pas di tengah
                hPos[i*3+2] = z;

                // Warna Merah / Pink Terang
                hCol[i*3] = 1.0;     // Merah
                hCol[i*3+1] = 0.05;  // Hijau
                hCol[i*3+2] = 0.2;   // Biru
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
            heartGeo.setAttribute('color', new THREE.BufferAttribute(hCol, 3));
            const hMat = new THREE.PointsMaterial({ 
                size: 0.35, 
                vertexColors: true, 
                blending: THREE.AdditiveBlending, 
                transparent: true 
            });
            heartMesh = new THREE.Points(heartGeo, hMat);
            scene.add(heartMesh);


            // B. MEMBUAT SPIRAL GALAXY DI BAWAH HATI
            const spiralGeo = new THREE.BufferGeometry();
            const spiralCount = 4000;
            const sPos = new Float32Array(spiralCount * 3);
            const sCol = new Float32Array(spiralCount * 3);

            for(let i=0; i<spiralCount; i++) {
                const radius = Math.random() * 30;
                const angle = radius * 0.4 + Math.random() * Math.PI * 2;
                
                sPos[i*3] = Math.cos(angle) * radius;
                sPos[i*3+1] = -12 + (Math.random() - 0.5) * 1.5; // Posisikan di bawah hati
                sPos[i*3+2] = Math.sin(angle) * radius;

                // Warna Merah Gelap / Ungu untuk dasar
                sCol[i*3] = 0.7;
                sCol[i*3+1] = 0.0;
                sCol[i*3+2] = 0.2;
            }

            spiralGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            spiralGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
            const sMat = new THREE.PointsMaterial({ 
                size: 0.2, 
                vertexColors: true, 
                blending: THREE.AdditiveBlending, 
                transparent: true 
            });
            spiralMesh = new THREE.Points(spiralGeo, sMat);
            scene.add(spiralMesh);

            // Tambahkan mata/inti bercahaya di tengah spiral bawah
            const coreGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.set(0, -12, 0);
            scene.add(coreMesh);

            window.addEventListener('resize', onWindowResize);
        }

        let clock = 0;
        function animate3D() {
            requestAnimationFrame(animate3D);
            clock += 0.02;

            // Animasi denyut jantung (membesar-mengecil sedikit)
            const scale = 1 + Math.sin(clock) * 0.03;
            heartMesh.scale.set(scale, scale, scale);

            // Putar spiral di bawah secara perlahan
            spiralMesh.rotation.y -= 0.003;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Jalankan
        init3D();
        animate3D();
    </script>
</body>
</html>
