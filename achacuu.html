<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spesial Untukmu - Galaxy Love</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020005; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
        }

        /* Tampilan Awal (Layar Pembuka) */
        #start-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0014 0%, #020005 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        #start-screen h2 {
            color: #ffb3c6;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            font-style: italic;
        }

        #start-btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            color: white;
            background: linear-gradient(45deg, #ff0055, #a200ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            animation: pulse-btn 2s infinite;
            font-weight: bold;
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 85, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
        }

        /* Kanvas Three.js */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Container Teks Orbit */
        #orbit-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0; 
            transition: opacity 2s ease 1s; 
        }

        .orbit-item {
            position: absolute;
            top: 50%; left: 50%;
            color: #ff4d6d;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            white-space: nowrap;
            will-change: transform;
        }

        .orbit-icon {
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
        }

        /* =========================================
           KODE BARU: KOMET BINTANG JATUH (LOVE) 
           ========================================= */
        #comet-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1.5; /* Di atas partikel 3D, di bawah teks orbit */
            pointer-events: none;
            overflow: hidden;
        }

        .comet {
            position: absolute;
            width: 150px;
            height: 30px;
            transform-origin: center;
            will-change: transform, opacity;
            animation: flyComet linear forwards;
        }

        .comet-head {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) rotate(0deg); /* Biar posisinya pas ngikutin ekor */
            font-size: 22px;
            filter: drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 20px #ffb3c6);
            z-index: 2;
        }

        .comet-tail {
            position: absolute;
            left: 15px; /* Ekor mulai sedikit di belakang bentuk love */
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(to right, rgba(255, 77, 109, 1) 0%, rgba(255, 77, 109, 0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px #ff0055;
            z-index: 1;
        }

        @keyframes flyComet {
            0% { transform: rotate(var(--angle)) translateX(20vw) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: rotate(var(--angle)) translateX(-150vw) scale(var(--scale)); opacity: 0; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2>semoga suka yaa..</h2>
        <button id="start-btn">Buka Bintangku ✨</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="comet-container"></div>

    <div id="orbit-container"></div>

    <script>
        // ==========================================
        // 1. KOMET BINTANG JATUH (LOVE) 
        // ==========================================
        function spawnComet() {
            const container = document.getElementById('comet-container');
            if (!container) return;

            const comet = document.createElement('div');
            comet.className = 'comet';

            // Posisi awal di sepertiga layar bagian atas (space kosong)
            const startY = Math.random() * (window.innerHeight * 0.4); 
            comet.style.top = `${startY}px`;
            comet.style.right = `-50px`; // Muncul dari kanan luar layar

            // Acak kecepatan, ukuran, dan kemiringan (angle) komet
            const scale = Math.random() * 0.6 + 0.8; // Ukuran bervariasi
            const duration = Math.random() * 2 + 1.5; // Komet meluncur 1.5s - 3.5s (Cepat)
            const angle = -(Math.random() * 15 + 10); // Kemiringan meluncur ke kiri-bawah

            comet.style.setProperty('--scale', scale);
            comet.style.setProperty('--angle', `${angle}deg`);
            comet.style.animationDuration = `${duration}s`;

            // Membuat kepala Komet (Bentuk Hati)
            const head = document.createElement('div');
            head.className = 'comet-head';
            head.innerHTML = '💖'; // Kamu bisa ganti ke ❤️ kalau suka yang lebih tebal

            // Membuat ekor cahaya pink
            const tail = document.createElement('div');
            tail.className = 'comet-tail';

            comet.appendChild(tail);
            comet.appendChild(head);
            container.appendChild(comet);

            // Bersihkan elemen dari HTML setelah komet selesai lewat agar HP tidak lemot
            setTimeout(() => {
                comet.remove();
            }, duration * 1000);
        }

        // ==========================================
        // 2. TEKS ORBIT HTML (achacuu:>)
        // ==========================================
        const orbitData = [
            "achacuu:>",
            "<span class='orbit-icon'>❤️</span>",
            "achacuu:>",
            "achacuu:>",
            "<span class='orbit-icon'>✨</span>",
            "achacuu:>",
            "achacuu:>",
            "<span class='orbit-icon'>💖</span>"
        ];

        const orbitContainer = document.getElementById('orbit-container');
        const elements = [];

        orbitData.forEach(item => {
            const el = document.createElement('div');
            el.className = 'orbit-item';
            el.innerHTML = item;
            orbitContainer.appendChild(el);
            elements.push(el);
        });

        let orbitTime = 0;
        function animateOrbit() {
            orbitTime += 0.005; // Kecepatan muter teks
            
            const isMobile = window.innerWidth < 768;
            const radiusX = isMobile ? window.innerWidth * 0.40 : window.innerWidth * 0.25; 
            const radiusY = isMobile ? window.innerHeight * 0.12 : window.innerHeight * 0.15; 
            
            elements.forEach((el, index) => {
                const angle = orbitTime + (index / elements.length) * Math.PI * 2;
                
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;
                
                const depth = Math.sin(angle); 
                const scale = (depth + 2.5) / 3; 
                const opacity = (depth + 1.5) / 2.5; 
                
                el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
                el.style.opacity = opacity;
                el.style.zIndex = Math.round(depth * 100);
            });
            requestAnimationFrame(animateOrbit);
        }
        animateOrbit();

        // ==========================================
        // 3. THREE.JS 3D ENVIRONMENT (Pusaran & Hati Utama)
        // ==========================================
        let scene, camera, renderer;
        let heartMesh, galaxyMesh, starsMesh;
        let isAnimatingWarp = false;

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 50, 100, 0.8)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020005, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 250); 
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const glowTexture = createGlowTexture();

            // A. BENTUK HATI DI TENGAH
            const heartGeo = new THREE.BufferGeometry();
            const heartCount = 4000;
            const hPos = new Float32Array(heartCount * 3);
            const hCol = new Float32Array(heartCount * 3);

            for(let i=0; i<heartCount; i++) {
                const t = Math.random() * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = (Math.random() - 0.5) * 2;
                
                const scatter = Math.random() * 1.2;
                const ang = Math.random() * Math.PI * 2;
                x += Math.cos(ang) * scatter;
                y += Math.sin(ang) * scatter;

                const scale = window.innerWidth < 768 ? 0.7 : 1;

                hPos[i*3] = x * scale;
                hPos[i*3+1] = (y * scale) + 8; 
                hPos[i*3+2] = z;

                hCol[i*3] = 1.0;     
                hCol[i*3+1] = 0.1;  
                hCol[i*3+2] = 0.4;   
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
            heartGeo.setAttribute('color', new THREE.BufferAttribute(hCol, 3));
            const hMat = new THREE.PointsMaterial({ 
                size: 1.2, 
                map: glowTexture,
                vertexColors: true, 
                blending: THREE.AdditiveBlending, 
                transparent: true,
                depthWrite: false
            });
            heartMesh = new THREE.Points(heartGeo, hMat);
            scene.add(heartMesh);


            // B. PUSARAN GALAXY BAWAH
            const galGeo = new THREE.BufferGeometry();
            const galCount = 8000; 
            const gPos = new Float32Array(galCount * 3);
            const gCol = new Float32Array(galCount * 3);

            const arms = 3; 
            for(let i=0; i<galCount; i++) {
                const radius = Math.random() * 35; 
                const spinAngle = radius * 0.3; 
                const armAngle = (Math.PI * 2 / arms) * (i % arms);
                
                const randomX = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 3;
                const randomY = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 1.5;
                const randomZ = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 3;

                gPos[i*3] = Math.cos(spinAngle + armAngle) * radius + randomX;
                gPos[i*3+1] = -15 + randomY; 
                gPos[i*3+2] = Math.sin(spinAngle + armAngle) * radius + randomZ;

                const mixedColor = new THREE.Color();
                const coreColor = new THREE.Color(0xffffff); 
                const edgeColor = new THREE.Color(0x880033); 
                mixedColor.lerpColors(coreColor, edgeColor, radius / 35);

                gCol[i*3] = mixedColor.r;
                gCol[i*3+1] = mixedColor.g;
                gCol[i*3+2] = mixedColor.b;
            }

            galGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
            galGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
            const gMat = new THREE.PointsMaterial({ 
                size: 1.5, 
                map: glowTexture,
                vertexColors: true, 
                blending: THREE.AdditiveBlending, 
                transparent: true,
                depthWrite: false
            });
            galaxyMesh = new THREE.Points(galGeo, gMat);
            scene.add(galaxyMesh);

            const coreGeo = new THREE.SphereGeometry(2, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.set(0, -15, 0);
            scene.add(coreMesh);


            // C. BINTANG/PARTIKEL BACKGROUND
            const starGeo = new THREE.BufferGeometry();
            const starCount = 1000;
            const sPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount; i++) {
                sPos[i*3] = (Math.random() - 0.5) * 150;
                sPos[i*3+1] = (Math.random() - 0.5) * 150;
                sPos[i*3+2] = (Math.random() - 0.5) * 150;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            const sMat = new THREE.PointsMaterial({ 
                color: 0xffc0cb, 
                size: 0.8, 
                map: glowTexture,
                transparent: true,
                blending: THREE.AdditiveBlending 
            });
            starsMesh = new THREE.Points(starGeo, sMat);
            scene.add(starsMesh);

            window.addEventListener('resize', onWindowResize);
        }

        let clock = 0;
        function animate3D() {
            requestAnimationFrame(animate3D);
            clock += 0.02;

            const scale = 1 + Math.sin(clock * 2) * 0.05;
            heartMesh.scale.set(scale, scale, scale);
            galaxyMesh.rotation.y -= 0.002;
            starsMesh.rotation.y += 0.0005;
            starsMesh.rotation.x += 0.0002;

            if (isAnimatingWarp) {
                const targetZ = window.innerWidth < 768 ? 85 : 55;
                const targetY = window.innerWidth < 768 ? 20 : 10;
                
                camera.position.z += (targetZ - camera.position.z) * 0.03;
                camera.position.y += (targetY - camera.position.y) * 0.03;

                if (Math.abs(camera.position.z - targetZ) < 1) {
                    isAnimatingWarp = false;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 4. LOGIKA TOMBOL MULAI
        // ==========================================
        document.getElementById('start-btn').addEventListener('click', () => {
            const startScreen = document.getElementById('start-screen');
            const orbitCont = document.getElementById('orbit-container');

            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 1500);

            isAnimatingWarp = true;
            orbitCont.style.opacity = '1';

            // Mulai munculin komet setelah animasi warp berjalan!
            // Komet lewat setiap 600 milidetik (Sering banget lewat)
            setTimeout(() => {
                setInterval(spawnComet, 600);
            }, 1000);
        });

        init3D();
        animate3D();
    </script>
</body>
</html>
