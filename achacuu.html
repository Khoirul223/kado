<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Love buat Kamu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        /* 1. LAYAR UTAMA (TOMBOL MASUK) */
        #welcome-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a0b2e 0%, #050510 100%);
            z-index: 10;
            transition: opacity 1.5s ease-in-out;
        }
        .box-welcome {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .box-welcome h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff477e, #ff85a2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .box-welcome p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 30px;
        }
        .btn-mulai {
            padding: 12px 35px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #ff477e, #b5179e);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 71, 126, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-mulai:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 71, 126, 0.8);
        }

        /* 2. AREA KANVAS 3D GALAXY */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* 3. TEKS STRUKTUR UTAMA DI BAWAH */
        #footer-title {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff85a2;
            text-shadow: 0 0 15px rgba(255, 133, 162, 0.8);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            letter-spacing: 2px;
        }

        /* 4. POPUP SURAT / KARTU KETIKA DIKLIK */
        #popup-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 15, 35, 0.85);
            border: 2px solid #ff477e;
            border-radius: 15px;
            padding: 25px;
            width: 320px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(255, 71, 126, 0.4);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease-in-out;
        }
        #popup-card.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #popup-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #popup-card h3 {
            color: #ff477e;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        #popup-card p {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .btn-tutup {
            padding: 6px 20px;
            background: #ff477e;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="welcome-screen">
        <div class="box-welcome">
            <h1>Galaxy Love</h1>
            <p>Sebuah semesta kecil khusus untukmu...</p>
            <button class="btn-mulai" onclick="masukGalaxy()">MASUK</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="footer-title">achacuu:></div>

    <div id="popup-card">
        <img id="popup-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300" alt="Love">
        <h3 id="popup-title">Judul Pesan</h3>
        <p id="popup-text">Isi pesan romantis di sini...</p>
        <button class="btn-tutup" onclick="tutupPopup()">Tutup</button>
    </div>

    <script>
        let scene, camera, renderer, galaxyParticles, orbitGroup;
        let targetSpeed = 0.002;
        let currentSpeed = 0.002;
        const container = document.getElementById('canvas-container');

        // Data isi kartu pop-up saat ikon melayang diklik
        const dataKonten = [
            { title: "Cinta Matiku", text: "Kamu adalah pusat dari semesta kecilku.", img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300" },
            { title: "Selamanya", text: "Berputar bersamamu sepanjang waktu tanpa akhir.", img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=300" },
            { title: "Pemilik Hatiku", text: "Tidak peduli seberapa jauh, hatiku selalu mengorbit padamu.", img: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=300" }
        ];

        function initThree() {
            // 1. Create Scene & Camera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 50);
            camera.lookAt(0, 0, 0);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 3. Membuat Galaksi Bentuk Hati (Love) Menggunakan Partikel
            const particleCount = 4000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                // Formula matematika membentuk hati (Heart Shape) di area 3D
                const t = Math.PI * 2 * Math.random();
                
                // Rumus Dasar Hati Koordinat X dan Z
                let x = 16 * Math.pow(Math.sin(t), 3);
                let z = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                let y = (Math.random() - 0.5) * 4; // Ketebalan pusaran galaksi

                // Memberi efek sebaran acak spiral galaksi
                const r = 1 + Math.random() * 0.4;
                x *= r;
                z *= r;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Gradasi warna galaksi (Pink, Ungu, Merah)
                const randomColor = Math.random();
                if (randomColor > 0.5) {
                    colors[i * 3] = 1.0;     // R
                    colors[i * 3 + 1] = 0.2; // G
                    colors[i * 3 + 2] = 0.5; // B
                } else {
                    colors[i * 3] = 0.6;
                    colors[i * 3 + 1] = 0.1;
                    colors[i * 3 + 2] = 0.9;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Tekstur titik partikel bulat glowing
            const pMaterial = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            galaxyParticles = new THREE.Points(geometry, pMaterial);
            scene.add(galaxyParticles);

            // 4. Membuat Objek Karakter yang Mengorbit (Menggunakan Kotak/Bola Indikator 3D Tampan)
            orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            // Menambahkan 3 titik objek interaktif melayang yang mengelilingi hati
            for(let i=0; i<3; i++) {
                const meshGeo = new THREE.DodecahedronGeometry(1.5, 0);
                const meshMat = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff, 
                    wireframe: true
                });
                const itemMesh = new THREE.Mesh(meshGeo, meshMat);
                
                // Mengatur sudut orbit awal berbeda
                itemMesh.userData = { 
                    angle: (i * Math.PI * 2) / 3, 
                    radius: 22 + (i * 3),
                    speed: 0.01 + (i * 0.005),
                    info: dataKonten[i]
                };
                orbitGroup.add(itemMesh);
            }

            // Pencahayaan
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // Event saat layar diubah ukurannya
            window.addEventListener('resize', onWindowResize);
            
            // Event klik mendeteksi objek melayang di layar
            window.addEventListener('click', onDocumentMouseDown);
            window.addEventListener('touchstart', onDocumentTouchStart);
        }

        // Animasi perputaran kamera dan partikel
        function animate() {
            requestAnimationFrame(animate);

            // Kecepatan putaran meledak/cepat saat awal klik masuk
            currentSpeed += (targetSpeed - currentSpeed) * 0.05;
            
            // Putar galaksi hati
            if (galaxyParticles) {
                galaxyParticles.rotation.y += currentSpeed;
            }

            // Putar objek-objek orbit melingkar
            if(orbitGroup) {
                orbitGroup.children.forEach(child => {
                    child.userData.angle += child.userData.speed;
                    child.position.x = Math.sin(child.userData.angle) * child.userData.radius;
                    child.position.z = Math.cos(child.userData.angle) * child.userData.radius;
                    child.position.y = Math.sin(child.userData.angle * 2) * 2;
                    child.rotation.x += 0.01;
                    child.rotation.y += 0.02;
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Aksi ketika klik tombol MASUK
        function masukGalaxy() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('footer-title').style.opacity = '1';
            }, 1500);

            // Efek warp masuk galaksi (akselerasi putaran cepat sesaat lalu normal)
            currentSpeed = 0.08;
            targetSpeed = 0.0025;

            // Gerakkan kamera mendekat perlahan agar cinematic
            let camInterval = setInterval(() => {
                if(camera.position.z > 35) {
                    camera.position.z -= 0.3;
                    camera.position.y -= 0.1;
                } else {
                    clearInterval(camInterval);
                }
            }, 20);
        }

        // Logika Raycaster mendeteksi sentuhan klik objek 3D melayang
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(orbitGroup.children);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData.info;
                bukaPopup(data.title, data.text, data.img);
            }
        }

        function onDocumentMouseDown(e) {
            checkIntersection(e.clientX, e.clientY);
        }

        function onDocumentTouchStart(e) {
            if(e.touches.length > 0) {
                checkIntersection(e.touches[0].clientX, e.touches[0].clientY);
            }
        }

        function bukaPopup(judul, teks, gambar) {
            document.getElementById('popup-title').innerText = judul;
            document.getElementById('popup-text').innerText = teks;
            document.getElementById('popup-img').src = gambar;
            document.getElementById('popup-card').classList.add('active');
        }

        function tutupPopup() {
            document.getElementById('popup-card').classList.remove('active');
        }

        // Jalankan sistem 3D saat web dimuat
        initThree();
        animate();
    </script>
</body>
</html>
