<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sund_blue | Kai</title>
    <style>
        /* Reset & Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container Utama Mobile-Friendly (Cocok untuk Bio IG) */
        .container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            position: relative;
            background: linear-gradient(180deg, #09090b 0%, #111115 100%);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Sistem Pemindah Layar (Screens) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* --- LAYAR 1: SAMBUTAN AWAL --- */
        .welcome-card {
            text-align: center;
            background: rgba(22, 22, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 85%;
        }

        .welcome-card p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e4e4e7;
        }

        .btn-next {
            background: #ffffff;
            color: #09090b;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-next:hover {
            background: #d4d4d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* --- LAYAR 2: UTAMA (PROFIL KAI) --- */
        .main-content {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Kotak Teks Perkenalan di Samping Kanan Atas */
        .profile-box {
            position: absolute;
            right: 20px;
            top: 50px;
            width: 60%;
            z-index: 20;
            background: rgba(15, 15, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(6px);
            animation: slideIn 1s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .profile-box h1 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .profile-box .username {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 12px;
            display: block;
        }

        .profile-box p {
            font-size: 14px;
            color: #d4d4d8;
            line-height: 1.5;
        }

        /* Bagian Hobi */
        .hobbies-section {
            margin-top: 15px;
        }

        .hobbies-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #71717a;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .hobbies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .hobby-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .hobby-tag:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: scale(1.03);
        }

        /* --- LINGKUNGAN: POHON, TANAH, RUMPUT --- */
        .environment {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Garis Horizontal dan Tekstur Tanah */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #271a10 0%, #150e0a 100%);
            border-top: 5px solid #14532d;
            box-sizing: border-box;
        }

        /* Tekstur Rumput Kecil-Kecil di Atas Tanah */
        .ground::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 12px;
            background-image: linear-gradient(45deg, #166534 25%, transparent 25%), 
                              linear-gradient(-45deg, #166534 25%, transparent 25%);
            background-size: 10px 24px;
        }

        /* Pohon di Samping Kiri */
        .tree-container {
            position: absolute;
            bottom: 55px;
            left: -15px;
            width: 160px;
            height: 300px;
        }

        /* --- ANIMASI DAUN BERGUGURAN --- */
        .leaf {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #9a3412;
            border-radius: 0 10px;
            opacity: 0.8;
            z-index: 15;
            pointer-events: none;
            animation: fallToGround linear forwards;
        }

        @keyframes fallToGround {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(var(--travel-y)) translateX(var(--travel-x)) rotate(var(--rotate-deg));
                opacity: 0;
            }
        }

        /* Tombol Kontrol Musik Mute/Unmute */
        .music-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            transition: 0.3s;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">

        <audio id="bg-music" src="lagu.flower.mp3" loop></audio>

        <div id="screen-welcome" class="screen">
            <div class="welcome-card">
                <p>halo makasi udah mau nengok link nya 😊</p>
                <button class="btn-next" onclick="startExperience()">Next</button>
            </div>
        </div>

        <div id="screen-main" class="screen hidden">
            
            <button class="music-btn" id="mute-btn" onclick="toggleMusic()">🎵</button>

            <div class="main-content">
                
                <div class="profile-box">
                    <h1>Hai, aku Kai</h1>
                    <span class="username">@sund_blue</span>
                    <p>halo aku sund_blue bisa di panggil kai. Selamat datang di halaman bio-ku!</p>
                    
                    <div class="hobbies-section">
                        <div class="hobbies-title">Hobbies</div>
                        <div class="hobbies-grid">
                            <span class="hobby-tag">⚽ Futsal</span>
                            <span class="hobby-tag">🏸 Badminton</span>
                            <span class="hobby-tag">🏊 Swimming</span>
                            <span class="hobby-tag">⚽ Football</span>
                            <span class="hobby-tag">💻 Coding</span>
                            <span class="hobby-tag">✍️ Writing Poetry</span>
                        </div>
                    </div>
                </div>

                <div class="environment">
                    <div class="tree-container" id="tree">
                        <svg viewBox="0 0 120 200" style="width: 100%; height: 100%;">
                            <path d="M70 200 C 65 160, 68 110, 60 80 C 50 70, 35 65, 25 55 M 60 80 C 65 60, 75 50, 95 35 M 70 200 C 78 170, 74 120, 78 95" stroke="#231711" stroke-width="6" fill="none" stroke-linecap="round"/>
                            <path d="M58 110 C 45 100, 40 85, 30 80" stroke="#231711" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M72 130 C 85 120, 95 115, 105 105" stroke="#231711" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <circle cx="30" cy="60" r="18" fill="#2d1c14" opacity="0.6"/>
                            <circle cx="90" cy="40" r="22" fill="#3a2218" opacity="0.5"/>
                            <circle cx="60" cy="45" r="25" fill="#1f130e" opacity="0.7"/>
                            <circle cx="40" cy="85" r="14" fill="#2d1c14" opacity="0.5"/>
                        </svg>
                    </div>

                    <div class="ground"></div>
                </div>

            </div>
        </div>

    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        let musicPlaying = false;

        function startExperience() {
            // Pindah Layar
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            
            // Putar musik saat user klik tombol Next
            bgMusic.play().then(() => {
                musicPlaying = true;
            }).catch(err => {
                console.log("Autoplay musik diblokir, bisa diputar manual lewat tombol.");
            });

            // Mulai efek daun gugur
            setInterval(createLeaf, 350);
        }

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                document.getElementById('mute-btn').innerText = '🔇';
                musicPlaying = false;
            } else {
                bgMusic.play();
                document.getElementById('mute-btn').innerText = '🎵';
                musicPlaying = true;
            }
        }

        function createLeaf() {
            const treeContainer = document.getElementById('tree');
            if (!treeContainer) return;

            const leaf = document.createElement('div');
            leaf.classList.add('leaf');

            // Posisi acak di sekitar dahan
            const startX = Math.random() * 80 + 20; 
            const startY = Math.random() * 90 + 20; 

            leaf.style.left = startX + 'px';
            leaf.style.top = startY + 'px';

            const colors = ['#9a3412', '#7c2d12', '#b45309', '#78350f'];
            leaf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.random() * 6 + 6;
            leaf.style.width = size + 'px';
            leaf.style.height = (size * 1.4) + 'px';

            // Animasi jatuh meluncur ke bawah
            const travelY = Math.random() * 120 + 160; 
            const travelX = -(Math.random() * 80 + 60); 
            const rotateDeg = Math.random() * 360 + 180; 
            const duration = Math.random() * 2.5 + 2.5; 

            leaf.style.setProperty('--travel-y', `${travelY}px`);
            leaf.style.setProperty('--travel-x', `${travelX}px`);
            leaf.style.setProperty('--rotate-deg', `${rotateDeg}deg`);
            leaf.style.animationDuration = duration + 's';

            document.querySelector('.main-content').appendChild(leaf);

            // Bersihkan memori agar web tidak berat
            setTimeout(() => {
                leaf.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
